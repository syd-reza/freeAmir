name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine app version
        id: app-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="nightly-$(date -u +'%Y%m%d')-${GITHUB_SHA::7}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Images are always published to GHCR under the repository owner.
      # Docker Hub is used only when DOCKERHUB_USERNAME / DOCKERHUB_TOKEN exist.
      - name: Resolve image names
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ghcr_base="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            dockerhub_base="$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
            echo "dockerhub_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            dockerhub_base=""
            echo "dockerhub_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Docker Hub skipped::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not configured, so images are published to GitHub Container Registry only."
          fi

          echo "ghcr=${ghcr_base}" >> "${GITHUB_OUTPUT}"
          echo "dockerhub=${dockerhub_base}" >> "${GITHUB_OUTPUT}"

          # Build the multiline image list for each image family
          append_images() {
            local suffix="$1"
            local output="$2"
            {
              echo "${output}<<EOF"
              echo "${ghcr_base}/freeamir-${suffix}"
              if [[ -n "${dockerhub_base}" ]]; then
                echo "${dockerhub_base}/freeamir-${suffix}"
              fi
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          }

          append_images app app_images
          append_images nginx nginx_images
          append_images all-in-one all_images

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # === 1. App ===
      - name: Extract metadata for App
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.app_images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/php-fpm/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: |
            ${{ steps.meta-app.outputs.labels }}
            org.opencontainers.image.version=${{ steps.app-version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}

      # === 2. Nginx ===
      - name: Extract metadata for Nginx
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.nginx_images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}

      # === 3. All in one ===
      - name: Extract metadata for All in one
        id: meta-all-in-one
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.all_images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push All in one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/all-in-one/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-all-in-one.outputs.tags }}
          labels: |
            ${{ steps.meta-all-in-one.outputs.labels }}
            org.opencontainers.image.version=${{ steps.app-version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
